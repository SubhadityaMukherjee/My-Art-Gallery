name: Generate Gallery

on:
  push:
    paths:
      - 'images/**'
      - 'data/featured.txt'
      - 'scripts/**'

jobs:
  generate-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Convert originals to WebP and cap sizes
        run: uv run python scripts/convert_to_webp.py

      - name: Run generate_gallery script
        run: uv run python scripts/generate_gallery.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A images data
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Convert images to WebP and update gallery.json [skip ci]"
            git push
          fi
